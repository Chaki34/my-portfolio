<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses | Codi_Die_Oxcide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --saffron: #FF9933;
            --dark-bg: #0a0a0a;
            --card-bg: #111111;
            --indian-green: #138808;
        }

        body { background-color: var(--dark-bg); font-family: 'Inter', sans-serif; color: white; overflow-x: hidden; }
        .header-font { font-family: 'Playfair Display', serif; }

        /* Hero Slider */
        .hero-slider { position: relative; height: 60vh; width: 100%; overflow: hidden; }
        .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease-in-out, transform 2s ease-in-out; transform: scale(1.1); }
        .slide.active { opacity: 1; transform: scale(1); }
        .slide-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(10,10,10,1)); }

        /* Course Card */
        .course-card { background: var(--card-bg); border: 1px solid #1f1f1f; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .course-card:hover { transform: translateY(-10px); border-color: var(--saffron); box-shadow: 0 15px 30px rgba(255, 153, 51, 0.1); }

        /* Locked State UI */
        .video-locked { filter: grayscale(1) blur(3px); opacity: 0.4; pointer-events: none; }
        .lock-badge { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; color: var(--saffron); font-size: 1.5rem; }

        /* Enrollment Action Bar */
        .enroll-bar { background: #1a1a1a; border: 1px solid var(--saffron); padding: 15px; border-radius: 12px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }

        /* Modal */
        #videoModal { display: none; position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); }
        .modal-content { background: #111; border: 1px solid #333; max-width: 900px; width: 95%; max-height: 85vh; overflow-y: auto; border-radius: 24px; margin: 5vh auto; }

        /* Flag Footer */
        .flag-stripes { width: 100%; height: 6px; display: flex; position: fixed; bottom: 0; z-index: 100; }
        .stripe-saffron { background: var(--saffron); flex: 1; }
        .stripe-white { background: #ffffff; flex: 1; }
        .stripe-green { background: var(--indian-green); flex: 1; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--saffron); border-radius: 10px; }
    </style>
</head>
<body class="pb-20">

<nav class="sticky top-0 bg-[#0a0a0a]/90 backdrop-blur-md px-6 md:px-12 py-4 flex justify-between items-center z-50 border-b border-white/5">
    <div class="flex items-center space-x-3">
        <div class="w-8 h-8 bg-[#FF9933] transform rotate-45 flex items-center justify-center text-black font-bold">
            <span class="-rotate-45">C</span>
        </div>
        <span class="header-font text-xl md:text-2xl tracking-tighter">Codi_Die_Oxcide</span>
    </div>
    <a th:href="@{/v1/index}" class="text-xs font-bold hover:text-[#FF9933] transition-all uppercase tracking-widest">
        <i class="fas fa-arrow-left mr-2"></i> Back to Home
    </a>
</nav>

<!-- Hero Sliding Section -->
<header class="hero-slider">
    <div class="slide active"><img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=1920&q=80" class="w-full h-full object-cover"></div>
    <div class="slide"><img src="https://images.unsplash.com/photo-1587620962725-abab7fe55159?auto=format&fit=crop&w=1920&q=80" class="w-full h-full object-cover"></div>
    <div class="slide"><img src="https://images.unsplash.com/photo-1550439062-609e1531270e?auto=format&fit=crop&w=1920&q=80" class="w-full h-full object-cover"></div>
    <div class="slide-overlay"></div>

    <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-6 z-10">
        <div id="quote-container" class="transition-opacity duration-700">
            <h1 id="hero-title" class="header-font text-5xl md:text-8xl mb-4">Master Your <span class="text-[#FF9933]">Craft</span></h1>
            <p id="hero-quote" class="text-gray-300 max-w-2xl mx-auto text-lg italic">"First, solve the problem. Then, write the code."</p>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-20">
    <div class="mb-12 border-l-4 border-[#FF9933] pl-6">
        <h2 class="text-3xl font-bold uppercase tracking-widest">Available Courses</h2>
        <p class="text-gray-500 font-mono text-sm uppercase">Directly synced from YouTube</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
        <div th:each="playlist : ${playlists}" class="course-card rounded-2xl overflow-hidden flex flex-col">
            <div class="relative aspect-video overflow-hidden">
                <img th:src="${playlist.snippet.thumbnails.high.url}" class="w-full h-full object-cover">
                <div class="absolute bottom-3 right-3 bg-black/80 px-3 py-1 rounded border border-[#FF9933] text-[10px] font-bold">
                    <span th:text="${playlist.contentDetails.itemCount}">0</span> VIDEOS
                </div>
            </div>
            <div class="p-8 flex-grow flex flex-col">
                <h3 class="text-xl font-bold mb-4" th:text="${playlist.snippet.title}">Course Name</h3>
                <p class="text-gray-400 text-sm mb-8 line-clamp-3" th:text="${playlist.snippet.description}">Description</p>

                <div class="mt-auto pt-6 border-t border-white/5">
                    <button th:data-id="${playlist.id}"
                            th:data-title="${playlist.snippet.title}"
                            onclick="openVideoModal(this.getAttribute('data-id'), this.getAttribute('data-title'))"
                            class="w-full bg-[#FF9933] text-black py-3 rounded-lg text-xs font-bold hover:bg-white transition uppercase tracking-widest">
                        View Course Structure
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Video Modal -->
<div id="videoModal">
    <div class="modal-content p-8 relative">
        <button onclick="closeModal()" class="absolute top-6 right-6 text-2xl hover:text-[#FF9933]">&times;</button>

        <h2 id="modalTitle" class="header-font text-3xl text-[#FF9933] mb-2">Playlist</h2>
        <p id="enrollMsg" class="text-gray-400 text-xs uppercase mb-6"></p>

        <!-- Enrollment Action -->
        <div id="actionContainer" class="enroll-bar">
            <div>
                <h4 class="font-bold text-white">Full Access Required</h4>
                <p class="text-[10px] text-gray-400">Enroll for free to unlock all modules.</p>
            </div>
            <button id="enrollBtn" class="bg-[#FF9933] text-black px-6 py-2 rounded-full text-xs font-black hover:bg-white transition">
                ENROLL NOW
            </button>
        </div>

        <div id="videoList" class="space-y-4">
            <!-- Videos injected here -->
        </div>
    </div>
</div>

<div class="flag-stripes">
    <div class="stripe-saffron"></div>
    <div class="stripe-white"></div>
    <div class="stripe-green"></div>
</div>

<script>
    // Enrollment Logic (Stored in Browser LocalStorage)
    const STORAGE_KEY = "codi_die_oxcide_enrollments";

    function isUserEnrolled(playlistId) {
        const enrollments = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return enrollments.includes(playlistId);
    }

    function enrollInCourse(playlistId, title) {
        let enrollments = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (!enrollments.includes(playlistId)) {
            enrollments.push(playlistId);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(enrollments));
        }
        alert("Success! You have enrolled in " + title);
        openVideoModal(playlistId, title); // Refresh UI
    }

    // Modal Logic
    function openVideoModal(playlistId, title) {
        const modal = document.getElementById('videoModal');
        const list = document.getElementById('videoList');
        const actionBox = document.getElementById('actionContainer');
        const enrollBtn = document.getElementById('enrollBtn');
        const enrollMsg = document.getElementById('enrollMsg');

        const enrolled = isUserEnrolled(playlistId);

        document.getElementById('modalTitle').innerText = title;
        modal.style.display = 'block';
        document.body.style.overflow = 'hidden';

        if (enrolled) {
            actionBox.style.display = 'none';
            enrollMsg.innerHTML = '<span class="text-green-500 font-bold"><i class="fas fa-check-circle"></i> Enrolled & Unlocked</span>';
        } else {
            actionBox.style.display = 'flex';
            enrollMsg.innerText = "Content is currently locked";
            enrollBtn.onclick = () => enrollInCourse(playlistId, title);
        }

        list.innerHTML = '<div class="py-10 text-center animate-pulse">Fetching Module Data...</div>';

        fetch('/v1/playlist-videos/' + playlistId)
            .then(res => res.json())
            .then(data => {
                list.innerHTML = '';
                data.forEach((video, index) => {
                    const videoId = video.snippet.resourceId.videoId;
                    const thumb = video.snippet.thumbnails ? video.snippet.thumbnails.default.url : '';

                    // Create Item
                    const item = document.createElement('div');
                    item.className = `relative flex items-center gap-4 bg-[#1a1a1a] p-4 rounded-xl border border-white/5 transition group ${!enrolled ? 'cursor-default' : 'cursor-pointer hover:border-[#FF9933]'}`;

                    if (enrolled) {
                        item.onclick = () => window.open(`https://www.youtube.com/watch?v=${videoId}`, '_blank');
                    }

                    item.innerHTML = `
                        <div class="${!enrolled ? 'video-locked' : ''} flex items-center gap-4 w-full">
                            <span class="text-[#FF9933] font-bold w-6">${index + 1}</span>
                            <img src="${thumb}" class="w-20 rounded border border-white/10">
                            <div class="flex-1">
                                <h4 class="text-sm font-bold line-clamp-1">${video.snippet.title}</h4>
                                <p class="text-[10px] text-gray-500 uppercase mt-1">Video Module</p>
                            </div>
                            <i class="fab fa-youtube text-xl ${enrolled ? 'text-red-600' : 'text-gray-800'}"></i>
                        </div>
                        ${!enrolled ? '<div class="lock-badge"><i class="fas fa-lock"></i></div>' : ''}
                    `;
                    list.appendChild(item);
                });
            });
    }

    function closeModal() {
        document.getElementById('videoModal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    // Hero Slider
    const slides = document.querySelectorAll('.slide');
    const heroTitle = document.getElementById('hero-title');
    const heroQuote = document.getElementById('hero-quote');
    const content = [
        { t: 'Master Your <span class="text-[#FF9933]">Craft</span>', q: '"Code is like humor. When you have to explain it, it’s bad."' },
        { t: 'Architecting <span class="text-[#FF9933]">Futures</span>', q: '"First, solve the problem. Then, write the code."' },
        { t: 'Engineering <span class="text-[#FF9933]">Excellence</span>', q: '"Quality is not an act, it is a habit."' }
    ];
    let cur = 0;
    setInterval(() => {
        slides[cur].classList.remove('active');
        cur = (cur + 1) % slides.length;
        setTimeout(() => {
            heroTitle.innerHTML = content[cur].t;
            heroQuote.innerText = content[cur].q;
            slides[cur].classList.add('active');
        }, 600);
    }, 5000);

    // Deep Linking Support (from index top bar)
    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const openId = urlParams.get('open');
        if (openId) {
            const btn = document.querySelector(`button[data-id="${openId}"]`);
            const title = btn ? btn.getAttribute('data-title') : "Course Content";
            openVideoModal(openId, title);
        }
    };
</script>
</body>
</html>
